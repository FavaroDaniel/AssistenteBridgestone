<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Diagnóstico - Bridgestone</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1e2024;
            --muted: #6f7782;
            --panel: #f3f3f3;
            --line: #e6e6e6;
            --header: #3b3f44;
            --accent: #cf2e2e;
            --primary: #3b3f44;
            --lightbtn: #efefef;
            --err: #d93025;
        }
        
        * { box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
            font-size: 14px;
        }
        
        .appbar {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--header);
            color: #fff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        
        .brand { font-weight: 900; letter-spacing: .5px; }
        .rightbar { display: flex; align-items: center; gap: 10px; }
        .dev { color: #fff; opacity: .85; font-size: 12px; white-space: nowrap; }
        
        .container { max-width: 980px; margin: 0 auto; padding: 16px; }
        
        .card {
            background: var(--panel);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid var(--line);
            box-shadow: 0 2px 6px rgba(0,0,0,.04);
            margin-bottom: 16px;
        }
        
        h2 { margin: 6px 0 10px 0; font-size: clamp(20px, 5.2vw, 28px); }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 740px) { .row { grid-template-columns: 1fr; } }
        
        .input, .select, .textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff; color: var(--fg); font-size: 15px;
        }
        .textarea { min-height: 120px; resize: none; }
        .input.error, .select.error, .textarea.error { border-color: var(--err); box-shadow: 0 0 0 3px rgba(217,48,37,.12); }
        
        .small { font-size: 12px; color: var(--muted); }
        .list { display: grid; gap: 12px; }
        
        .item {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
        }
        .item.error { border-color: var(--err); box-shadow: 0 0 0 3px rgba(217,48,37,.12); }
        .item .title { font-weight: 900; font-size: clamp(18px, 4.6vw, 20px); }
        .item .how { margin-top: 6px; color: #333; }
        .item .obs {
            width: 100%; min-height: 52px; margin-top: 8px; border-radius: 10px;
            border: 1px solid #ddd; padding: 8px; background: #fafafa; resize: none; color: #111;
        }
        
        .btn {
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 22px; border-radius: 12px; border: 1px solid transparent; font-weight: 800; font-size: 15px;
            transition: .15s transform, .15s filter; white-space: nowrap;
        }
        .btn:active { transform: translateY(1px); }
        .btn[disabled] { opacity: .6; cursor: not-allowed; }
        .btn.gray { background: var(--lightbtn); border-color: #d6d9df; color: #1f2328; }
        .btn.dark { background: var(--primary); color: #fff; border: 1px solid #2c2f34; }
        .btn.red { background: var(--accent); color: #fff; border: 1px solid #b81f1f; }
        .btn.outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .appbar .btn.outline { border-color: #fff; color: #fff; }
        .btn.icon .ic { width: 16px; height: 16px; display: inline-block; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        @media (max-width: 520px) { .actions .btn { flex: 1 1 calc(50% - 8px); } }
        @media (min-width: 521px) { .actions .btn { flex: 0 0 auto; } }
        
        .badge { padding: 3px 8px; border-radius: 999px; background: #eee; color: #333; font-size: 12px; }
        .progress { height: 10px; border-radius: 999px; background: #eee; overflow: hidden; margin: 8px 0 0; }
        .progress>span { display: block; height: 100%; background: var(--accent); width: 0%; }
        
        .photo-row { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: start; margin-bottom: 10px; }
        .photo-row img { object-fit: contain; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
        .photo-row img.portrait { width: 90px; height: 120px; }
        .photo-row img.landscape { width: 120px; height: 90px; }
        .photo-row .caption { width: 100%; min-height: 40px; }
        
        /* === DIAGRAMAS: CENTRALIZADOS E ESTÁVEIS NO MOBILE === */
        .diagram-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px 20px;
            justify-items: center;
            margin: 12px 4px 12px;
            width: 100%;
        }
        @media (min-width: 700px) {
            .diagram-grid { grid-template-columns: repeat(2, minmax(280px,1fr)); gap: 32px 28px; }
        }
        .diag-block { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 340px; margin: 0 auto; }
        .diag-title { font-weight: 900; font-size: clamp(14px,3.5vw,16px); color: var(--fg); text-align: center; }
        
        /* Tamanho fixo para não "puxar" à direita */
        .circle {
            --C: 280px;                 /* tamanho fixo do diagrama */
            position: relative;
            width: var(--C);
            height: var(--C);
            border-radius: 50%;
            background: #fff;
            border: 2px solid #dbe3ef;
            box-shadow: inset 0 0 0 6px #f5f7fb;
            margin: 10px auto;
        }
        .circle .axis {
            position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #dbe3ef; transform: translateX(-50%);
        }
        .circle .axis.h {
            top: 50%; left: 0; right: 0; height: 2px; width: auto; transform: translateY(-50%);
        }
        
        .qwrap { position: absolute; display: flex; align-items: center; gap: 6px; z-index: 1; }
        .qwrap input.q {
            width: 110px;              /* largura estável */
            padding: 10px 34px 10px 10px;
            border-radius: 12px; border: 1px solid #cfd4da;
            text-align: center; background: #fafafa; font-weight: 800; font-size: 14px;
        }
        .qwrap .unit { position: absolute; right: 8px; pointer-events: none; color: #666; font-size: 12px; }
        .qwrap.top    { top: 18%; left: 50%; transform: translate(-50%,-50%); }
        .qwrap.bottom { top: 82%; left: 50%; transform: translate(-50%,-50%); }
        .qwrap.left   { left: 15%; top: 50%; transform: translate(-50%,-50%); }
        .qwrap.right  { left: 85%; top: 50%; transform: translate(-50%,-50%); }
        
        /* === IMPRESSÃO / PDF === */
        @media print {
            .no-print { display: none !important; }
            #printArea { display: block !important; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            
            /* Nunca quebrar blocos curtos ou diagramas no meio */
            .avoid-break, .print-diagram, .diagram-grid, .print-photos figure {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            /* Tabela do checklist: pode continuar na próxima página,
               mas sem cortar etapa/linha pela metade */
            .report-table {
                page-break-inside: auto !important;
                break-inside: auto !important;
            }
            .report-table thead {
                display: table-header-group;
            }
            .report-table tbody {
                display: table-row-group;
            }
            .report-table tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .report-table td, .report-table th {
                vertical-align: top;
            }

            /* Forçar 2 colunas (2x2) no PDF */
            .diagram-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 20px 40px !important;
            }
        }
        
        #printArea { display: none; }
        .print-diagram .qval {
            position: absolute; transform: translate(-50%,-50%);
            padding: 3px 6px; border: 1px solid #bbb; border-radius: 8px; background: #f7f7f7; font-size: 13px;
        }
        .print-diagram .qval.top { left: 50%; top: 20%; }
        .print-diagram .qval.right { left: 80%; top: 50%; }
        .print-diagram .qval.bottom { left: 50%; top: 80%; }
        .print-diagram .qval.left { left: 20%; top: 50%; }
        
        .print-photos {
            display: grid;
            grid-template-columns: repeat(2, minmax(280px, 1fr));
            gap: 18px 20px;
            margin-top: 8px;
        }
        .print-photos figure {
            margin: 0;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .print-photos img {
            width: 100%;
            height: auto;
            object-fit: contain; /* mostra a foto inteira, sem recortar bordas */
            object-position: center;
            background: #fff;
            border: 1px solid #bbb;
            border-radius: 8px;
        }
        /* Formato automático no PDF: retrato = 3:4; paisagem/tela larga = 4:3. */
        .print-photos img.portrait { aspect-ratio: 3 / 4; }
        .print-photos img.landscape { aspect-ratio: 4 / 3; }
        .print-photos figcaption {
            margin-top: 4px;
        }
        
        .toast {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: #111; color: #fff; padding: 10px 14px; border-radius: 10px; opacity: 0; transition: .2s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
        
        /* Câmera modal */
        #camModal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 50; }
        #camBox { background: #fff; padding: 16px; border-radius: 12px; max-width: 720px; width: 95%; }
        .branch-hint { display:none; margin-top:8px; padding:9px 11px; border-radius:8px; background:#f4f4f4; border-left:4px solid #555; font-size:12px; line-height:1.45; }
        .branch-hint.show { display:block; }
        .branch-hint strong { font-weight:800; }
        #camBox video, #camBox canvas { width: 100%; max-height: 60vh; background: #000; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="appbar no-print">
        <div class="brand">BRIDGESTONE</div>
        <div class="rightbar">
            <button id="btnClear" class="btn outline" title="Reseta tudo">Limpar</button>
        </div>
    </div>

    <div class="container no-print">
        <div class="card" id="cardInit">
            <h2>Assistente de Diagnóstico</h2>
            <div class="row">
                <div>
                    <label class="small">Nº da WO (ordem de serviço) <span style="color:var(--err)">*</span></label>
                    <input id="inpWO" class="input" placeholder="Ex.: 123456">
                </div>
                <div>
                    <label class="small">Nome do técnico <span style="color:var(--err)">*</span></label>
                    <input id="inpTec" class="input" placeholder="Ex.: João Silva">
                </div>
            </div>

            <h2 style="margin-top:14px">Escolha o defeito</h2>
            <select id="selDef" class="select">
                <option value="" selected>— selecione —</option>
                <option value="Abortou a Cura">Abortou a Cura</option>
                <option value="Falta de Cura">Falta de Cura</option>
                <option value="prensa_fechamento">Prensa não fecha / não completa fechamento</option>
            </select>

            <!-- Campos adicionais do cabeçalho, exclusivos para Falta de Cura -->
            <div id="fcHeaderFields" style="display:none;margin-top:14px">
                <div class="row">
                    <div>
                        <label class="small">RL</label>
                        <input id="inpRL" class="input" placeholder="Ex.: 12345">
                    </div>
                    <div>
                        <label class="small">Prensa</label>
                        <input id="inpPrensa" class="input" placeholder="Ex.: E-09/10">
                    </div>
                </div>
                <div class="row" style="margin-top:12px">
                    <div>
                        <label class="small">Lado</label>
                        <input id="inpLado" class="input" placeholder="Ex.: Esquerdo / Direito">
                    </div>
                    <div>
                        <label class="small">Turno</label>
                        <input id="inpTurno" class="input" placeholder="Ex.: 3º turno">
                    </div>
                </div>
                <div class="row" style="margin-top:12px">
                    <div>
                        <label class="small">Grupo</label>
                        <input id="inpGrupo" class="input" placeholder="Ex.: A">
                    </div>
                    <div>
                        <label class="small">Pneu</label>
                        <input id="inpPneu" class="input" placeholder="Ex.: medida / especificação">
                    </div>
                </div>
                <div style="margin-top:12px">
                    <label class="small">Data do Setup</label>
                    <input id="inpDataSetup" class="input" type="date">
                </div>
            </div>
            <div class="actions" style="justify-content:flex-end;margin-top:10px">
                <button id="btnGo" class="btn dark">Avançar</button>
            </div>
        </div>

        <div class="card" id="cardChk" style="display:none">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                <div><strong id="chkTitle" style="font-size:22px">Checklist</strong><br>
                    <span class="small">Marque OK / NOK / N.A. e registre observações (NOK exige observação)</span></div>
                <div class="badge"><span id="done">0</span>/<span id="total">0</span></div>
            </div>
            <div class="progress"><span id="bar"></span></div>
            <div id="lista" class="list" style="margin-top:12px"></div>

            <!-- Ações finais -->
            <div class="actions" style="justify-content:flex-end;margin-top:10px">
                <label class="btn gray icon">
                    <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M5 7h3l1-2h6l1 2h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm7 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
                    </svg>
                    Anexar imagem
                    <input id="filePhoto" type="file" accept="image/*" hidden>
                    <input id="cameraPhoto" type="file" accept="image/*" capture="environment" hidden>
                </label>
                <button id="btnCam" class="btn gray icon" title="Abrir câmera">
                    <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M4 7h3l1.2-2.4A1 1 0 0 1 9 4h6a1 1 0 0 1 .9.6L17 7h3a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zm8 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
                    </svg>
                    Tirar foto
                </button>
                <button id="btnDownloadAll" class="btn gray" disabled>Baixar todas as fotos</button>
                <button id="btnResumo" class="btn red">Gerar resumo para o BAMM</button>
                <button id="btnPDF" class="btn dark">Salvar PDF</button>
            </div>

            <div id="photoList" style="margin-top:12px"></div>
        </div>

        <div class="card" id="cardOut" style="display:none">
            <h2>Resumo</h2>
            <textarea id="out" class="textarea" placeholder="Resumo gerado aqui…"></textarea>
            <div class="actions" style="justify-content:flex-end;margin-top:8px">
                <button id="btnCopy" class="btn gray">Copiar</button>
                <button id="btnReset" class="btn dark">Novo</button>
            </div>
        </div>
    </div>

    <!-- Modal da câmera -->
    <div id="camModal" class="no-print" aria-hidden="true">
        <div id="camBox">
            <div style="display:grid;gap:8px">
                <video id="video" playsinline></video>
                <canvas id="canvas" style="display:none"></canvas>
                <div class="actions" style="justify-content:flex-end">
                    <button id="btnShot" class="btn red">Capturar</button>
                    <button id="btnUse" class="btn dark" style="display:none">Usar foto</button>
                    <button id="btnClose" class="btn gray">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Área de impressão (PDF) -->
    <div id="printWrap">
        <div id="printArea">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                <div style="font-weight:800">Assistente de Diagnóstico</div>
                <div style="font-weight:900;letter-spacing:1px">BRIDGESTONE</div>
            </div>
            <div style="font-weight:700" id="phHeader"></div>
            <div id="phDefeito" style="margin:6px 0 4px">Defeito:</div>
            <div id="phWO" class="small" style="margin:0 0 2px"></div>
            <div id="phTec" class="small" style="margin:0 0 4px"></div>
            <div id="phExtraHeader" class="small avoid-break" style="display:none;margin:0 0 10px;line-height:1.6"></div>
            <div id="phDiagramas" class="avoid-break" style="margin-bottom:6px"></div>
            <div>
                <table class="report-table" style="width:100%;border-collapse:collapse;margin:10px 0" border="1" cellpadding="6">
                    <thead><tr><th style="width:40%">Passo</th><th style="width:10%">Status</th><th>Observação</th></tr></thead>
                    <tbody id="phTable"></tbody>
                </table>
            </div>
            <div id="phFotosWrap" style="display:none;margin-top:12px">
                <div style="font-weight:700;margin-bottom:6px">Fotos do diagnóstico</div>
                <div class="print-photos" id="phFotos"></div>
            </div>
            <div style="font-weight:700;margin:10px 0 4px">Resumo para BAMM</div>
            <pre id="phResumo" style="white-space:pre-wrap;margin:0"></pre>
        </div>
    </div>

    <div id="toast" class="toast no-print" role="status" aria-live="polite">OK</div>

    <script>
        // Dados dos defeitos e checklists
        const DATA = {
            "defeitos": ["Abortou a Cura", "Falta de Cura", "prensa_fechamento"],
            "itens_por_defeito": {
                "Abortou a Cura": [
                    {"PassoOrdem":1,"OQueVerificar":"Teste de vazamento","ComoVerificar":"Instalar tampão e executar teste; confirmar se o aborto ocorreu logo após a etapa de vazamento."},
                    {"PassoOrdem":2,"OQueVerificar":"Válvula de descarga do shaping","ComoVerificar":"Checar passagem/obstrução; remover resíduos e garantir acionamento correto."},
                    {"PassoOrdem":3,"OQueVerificar":"Condições do bladder","ComoVerificar":"Verificar se está solto, furado, mal posicionado ou com vedação comprometida."},
                    {"PassoOrdem":4,"OQueVerificar":"Anéis e O'rings","ComoVerificar":"Inspecionar desgaste/cortes e montagem; reinstalar conforme procedimento."},
                    {"PassoOrdem":5,"OQueVerificar":"Pressão do ar do timer (≈55 psi)","ComoVerificar":"Medir no bloco do timer; se baixo, procurar vazamentos na linha."},
                    {"PassoOrdem":6,"OQueVerificar":"Solenoides e válvulas 5/2 do timer","ComoVerificar":"Verificar travamento de carretel/passa-ar; testar acionamentos."},
                    {"PassoOrdem":7,"OQueVerificar":"Cartão de saída do timer (CLP)","ComoVerificar":"Monitorar saídas durante a cura; testar com tampão para falha intermitente."},
                    {"PassoOrdem":8,"OQueVerificar":"Mangueiras/tubos do sistema interno","ComoVerificar":"Inspecionar layout, rachaduras, folgas ou vazamentos; substituir se necessário."},
                    {"PassoOrdem":9,"OQueVerificar":"Obstrução em transmissores de pressão","ComoVerificar":"Conferir leitura; desobstruir linha de sinal e checar conectores."},
                    {"PassoOrdem":10,"OQueVerificar":"Sistema de segurança/acionamento","ComoVerificar":"Confirmar retornos OK de atuadores e sensores; limites de prensa."},
                    {"PassoOrdem":11,"OQueVerificar":"Limite pneumático","ComoVerificar":"Verificar liberação de ar quando acionado; checar atuador e vazamentos."},
                    {"PassoOrdem":12,"OQueVerificar":"Relés de acionamento das válvulas","ComoVerificar":"Testar relés do timer/blocos; substituir se sem pulso ou travados."}
                ],
                "Falta de Cura": [
                    {"PassoOrdem":1,"Tipo":"DIAGRAMA","Alvo":"Molde Esquerdo","Unidade":"°F"},
                    {"PassoOrdem":1,"Tipo":"DIAGRAMA","Alvo":"Molde Direito","Unidade":"°F"},
                    {"PassoOrdem":1,"Tipo":"DIAGRAMA","Alvo":"Platen Esquerdo","Unidade":"°F"},
                    {"PassoOrdem":1,"Tipo":"DIAGRAMA","Alvo":"Platen Direito","Unidade":"°F"},
                    {"PassoOrdem":2,"OQueVerificar":"Válvulas manuais da prensa","ComoVerificar":"Conferir posição de funcionamento. Garantir abertura total; verificar alavanca/manopla."},
                    {"PassoOrdem":3,"OQueVerificar":"Válvulas manuais do Trench","ComoVerificar":"Conferir posição de funcionamento. Garantir abertura total; verificar alavanca/manopla."},
                    {"PassoOrdem":4,"OQueVerificar":"Mangueiras de entrada e retorno (sistema interno)","ComoVerificar":"Verificar layout, integridade e vazamentos; procurar achatamentos/torções."},
                    {"PassoOrdem":5,"OQueVerificar":"Mangueiras da chapa e do molde","ComoVerificar":"Verificar layout, integridade e vazamentos; procurar achatamentos/torções."},
                    {"PassoOrdem":6,"OQueVerificar":"Bladders (condição geral)","ComoVerificar":"Inspecionar furos, desgaste e fixação."},
                    {"PassoOrdem":7,"OQueVerificar":"Inspeção do pistão e passagem de água","ComoVerificar":"Inspecionar sinais de vazamento, passagem no pistão, verificar êmbolos e vedações."},
                    {"PassoOrdem":8,"OQueVerificar":"Inspeção de vazamentos gerais: mecanismo central, carregadores, descarregador, molde segmentado etc.","ComoVerificar":"Inspecionar sinais de vazamento, mangueiras furadas, conectores danificados, cilindros etc."},
                    {"PassoOrdem":9,"OQueVerificar":"Drenos e purgadores","ComoVerificar":"Abrir purgador; verificar saída de condensado e fechamento."},
                    {"PassoOrdem":10,"OQueVerificar":"Checagem de sensores de temperatura/pressão","ComoVerificar":"Comparar leituras com valores de referência; verificar cabos, conectores."},
                    {"PassoOrdem":11,"OQueVerificar":"Análise dos gráficos de temperatura e pressão (IHM/CCM)","ComoVerificar":"Comparar curvas com parâmetros da carta; buscar anomalias."},
                    {"PassoOrdem":12,"OQueVerificar":"Confirmação do tempo de cura","ComoVerificar":"Verificar tempo no IHM e comparar com a carta."},
                    {"PassoOrdem":13,"OQueVerificar":"Aquecimento inicial antes do ciclo","ComoVerificar":"Confirmar se o aquecimento da prensa foi realizado corretamente, antes do carregamento."}
                ],
                "prensa_fechamento": [
                    {"PassoOrdem":1,"OQueVerificar":"Condição da falha antes do reset","ComoVerificar":"Antes de resetar, registrar alarmes da IHM/painel, lado da prensa, etapa do ciclo em que parou, posição aproximada da prensa e quais permissivos não estão atendidos. Registrar foto da tela quando houver informação relevante."},
                    {"PassoOrdem":2,"OQueVerificar":"Interferência física ou componente impedindo o fechamento","ComoVerificar":"Inspecionar visualmente a região da prensa e confirmar se não há pneu, carregador, descarregador, garra, anel, molde ou outro componente fora de posição/interferindo mecanicamente. Para qualquer intervenção na zona de risco, seguir o procedimento de bloqueio da área.","RamoNOK":"Corrija a interferência encontrada e repita o comando de fechamento. Se a falha permanecer, prossiga para segurança e permissivos."},

                    {"PassoOrdem":6,"OQueVerificar":"Posição e condição mecânica do carregador","ComoVerificar":"Verificar se o carregador chegou completamente à posição esperada, sem travamento, desalinhamento ou altura incorreta. Inspecionar mecanismo, guias e componentes que possam impedir o retorno completo."},
                    {"PassoOrdem":7,"OQueVerificar":"Indicação de descarregador fora da prensa","ComoVerificar":"Confirmar indicação de DESCARREGADOR FORA nos lados aplicáveis. Verificar limites/sensores, hastes, atuadores, suportes, regulagem e se o mecanismo realmente atingiu a posição final."},
                    {"PassoOrdem":8,"OQueVerificar":"Posição do molde segmentado / segmento estendido","ComoVerificar":"Confirmar indicação de SEGMENTO ESTENDIDO nos dois lados. Verificar sensores ou limites, posição dos atuadores, hastes, suportes, fixação e regulagem. Confirmar que o acionamento ocorre com margem suficiente e não apenas no limite.","RamoNOK":"Siga para o passo 9 e diferencie falha de indicação/sensor de falha real no movimento do segmentado."},
                    {"PassoOrdem":9,"OQueVerificar":"Movimento mecânico do molde segmentado","ComoVerificar":"Verificar se todos os segmentos completam o movimento sem travamento, esforço anormal ou atraso. Inspecionar mecanismo, lubrificação, folgas, desalinhamento e condição mecânica. Se aplicável, verificar o funcionamento/alívio responsável pelo movimento do segmentado.","RamoNOK":"Se o movimento estiver incompleto ou fraco, priorize também o passo 13 para verificar o sistema hidráulico/pneumático responsável pelo acionamento."},
                    {"PassoOrdem":10,"OQueVerificar":"Posição do anel inferior","ComoVerificar":"Confirmar se o anel inferior está na posição exigida para permitir o fechamento. Verificar sensores/limites, atuadores, haste, mecanismo e possíveis travamentos.","RamoNOK":"Se o anel não completa o movimento, verifique o atuador e depois o sistema hidráulico/pneumático do passo 13."},
                    {"PassoOrdem":11,"OQueVerificar":"Posição do anel superior","ComoVerificar":"Nas prensas aplicáveis, confirmar posição correta do anel superior e respectiva indicação. Verificar sensores, atuadores, mecanismo e possíveis interferências.","RamoNOK":"Se o anel não completa o movimento, verifique o atuador e depois o sistema hidráulico/pneumático do passo 13."},
                    {"PassoOrdem":12,"OQueVerificar":"Pressão do molde","ComoVerificar":"Comparar a pressão indicada com o valor especificado para a condição da máquina. Verificar pressão excessiva ou insuficiente, regulagem e possíveis alterações que estejam interferindo no fechamento.","RamoNOK":"Priorize o circuito responsável pela pressão do molde e confirme válvulas/regulagem no passo 13 antes de investigar o acionamento principal."},
                    {"PassoOrdem":13,"OQueVerificar":"Sistema hidráulico/pneumático de movimentação","ComoVerificar":"Nas prensas aplicáveis, verificar pressão disponível, cilindros, válvulas, solenoides, reguladores e vazamentos. Confirmar se as válvulas responsáveis pelo movimento estão comandando e retornando normalmente."},
                    {"PassoOrdem":14,"OQueVerificar":"Alarmes de aquecimento / vapor e permissivos associados","ComoVerificar":"Verificar se algum alarme ou condição de aquecimento está bloqueando a sequência. Confirmar permissivos relacionados a aquecimento/vapor e comparar o estado mostrado na IHM com a condição real da prensa."},
                    {"PassoOrdem":15,"OQueVerificar":"Comando do motor principal de abertura/fechamento","ComoVerificar":"Nas prensas com acionamento eletromecânico, verificar se existe comando para o motor quando solicitado o fechamento. Conferir contatores, relés de comando e indicação de funcionamento antes de avançar para o circuito de potência.","RamoOK":"Com comando presente, concentre a investigação nos passos 16 a 19: proteção, corrente/esforço, freio e transmissão mecânica.","RamoNOK":"Sem comando para o motor, priorize os passos 20 a 23: retorno de prensa fechada, posição/encoder, entradas e saídas do CLP e alimentação/comunicação do controle."},
                    {"PassoOrdem":16,"OQueVerificar":"Relé térmico / proteção do motor principal","ComoVerificar":"Verificar se a proteção está desarmada ou apresentando mau contato. Conferir ajuste conforme os dados do motor e investigar a causa do desarme antes de simplesmente rearmar.","RamoNOK":"Depois de identificar a causa do desarme, utilize a corrente do passo 17 para diferenciar sobrecarga mecânica de problema elétrico/acionamento."},
                    {"PassoOrdem":17,"OQueVerificar":"Corrente e esforço do motor durante o fechamento","ComoVerificar":"Quando aplicável e com medição segura, comparar a corrente durante o fechamento com o comportamento normal da prensa. Corrente elevada pode indicar freio arrastando, pressão excessiva, travamento mecânico ou problema na transmissão.","RamoNOK":"Com corrente/esforço anormal, priorize o freio no passo 18 e a transmissão mecânica no passo 19, além de reavaliar pressão e travamentos."},
                    {"PassoOrdem":18,"OQueVerificar":"Freio do motor da prensa","ComoVerificar":"Verificar se o freio libera corretamente durante o comando e se não permanece arrastando. Inspecionar bobina, alimentação, regulagem, discos e condição mecânica conforme o modelo instalado."},
                    {"PassoOrdem":19,"OQueVerificar":"Transmissão mecânica do fechamento","ComoVerificar":"Se o motor recebe comando e gira sem movimentação normal da prensa, verificar acoplamento, chaveta, eixo, redutor e demais elementos de transmissão quanto a quebra, folga ou travamento."},
                    {"PassoOrdem":20,"OQueVerificar":"Limite / sensor de prensa fechada","ComoVerificar":"Verificar o dispositivo responsável pela indicação final de PRENSA FECHADA. Conferir atuação mecânica, haste/atuador, regulagem, fixação e sinal elétrico. Confirmar que o fechamento físico corresponde à indicação do controle.","RamoNOK":"Confirme no passo 22 se a mudança física do sensor chega corretamente à entrada do CLP."},
                    {"PassoOrdem":21,"OQueVerificar":"Encoder / contador de pulso / referência de posição","ComoVerificar":"Nas prensas que utilizam encoder ou contador de pulsos, acompanhar a leitura durante o movimento e verificar se varia continuamente. Conferir referência de prensa aberta/fechada, conectores, alimentação e possível perda de posição.","RamoNOK":"Se a leitura estiver parada, errática ou sem referência, confirme alimentação/comunicação e o sinal visto pelo controle nos passos 22 e 23."},
                    {"PassoOrdem":22,"OQueVerificar":"Entradas e saídas do PLC/CLP","ComoVerificar":"Comparar no diagnóstico do PLC/CLP os comandos e retornos envolvidos no fechamento. Confirmar se o sinal físico chega à entrada e se a saída esperada é comandada. Verificar módulos/cartões e LEDs de diagnóstico quando houver divergência.","RamoNOK":"Se vários sinais estiverem ausentes ou incoerentes simultaneamente, priorize o passo 23 antes de condenar sensores ou cartões isoladamente."},
                    {"PassoOrdem":23,"OQueVerificar":"Alimentação e comunicação do sistema de controle","ComoVerificar":"Se houver falhas intermitentes ou perda de vários sinais simultaneamente, verificar fontes, alimentação dos módulos, comunicação, conectores de rede e LEDs de PLC/CLP, remotas, módulos de segurança e acionamentos."}

        document.addEventListener('DOMContentLoaded', function() {
            const $ = s => document.querySelector(s);
            const $$ = s => Array.from(document.querySelectorAll(s));
            const toast = $("#toast");
            const showToast = (t) => { toast.textContent = t; toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 3000); };

            let ITEMS = [], DEF_ATUAL = "", DEF_LABEL = "", PHOTOS = [], stream = null;

            // DIAGRAMAS
            function buildCircle(idPrefix) {
                const circle = document.createElement('div');
                circle.className = 'circle';
                circle.innerHTML = `
                    <div class="axis"></div><div class="axis h"></div>
                    <div class="qwrap top"><input id="${idPrefix}_top" class="q" inputmode="decimal"><span class="unit">°F</span></div>
                    <div class="qwrap right"><input id="${idPrefix}_right" class="q" inputmode="decimal"><span class="unit">°F</span></div>
                    <div class="qwrap bottom"><input id="${idPrefix}_bottom" class="q" inputmode="decimal"><span class="unit">°F</span></div>
                    <div class="qwrap left"><input id="${idPrefix}_left" class="q" inputmode="decimal"><span class="unit">°F</span></div>`;
                return circle;
            }

            function renderDiagGroup() {
                const wrap = document.createElement('div');
                wrap.className = 'item avoid-break';
                wrap.innerHTML = `<div class="title">1. Medição de temperatura do molde e platen com termo visor</div>
                                  <div class="how"><strong>Como verificar:</strong> Medir 4 pontos com termo visor; comparar com carta (Exemplo: ~290°F); registrar no diagrama.</div>`;
                
                const grid = document.createElement('div');
                grid.className = 'diagram-grid';
                
                const block = (titulo, idPrefix) => {
                    const holder = document.createElement('div');
                    holder.className = 'diag-block';
                    const h = document.createElement('div');
                    h.textContent = titulo;
                    h.className = 'diag-title';
                    holder.append(h);
                    holder.append(buildCircle(idPrefix));
                    return holder;
                };
                
                grid.append(block('Molde Esquerdo', 'diag1'));
                grid.append(block('Molde Direito', 'diag2'));
                grid.append(block('Platen Esquerdo', 'diag3'));
                grid.append(block('Platen Direito', 'diag4'));
                wrap.append(grid);
                
                const note = document.createElement('div');
                note.className = 'small';
                note.textContent = 'Obs.: estes campos não entram na contagem de progresso e não exigem OK/NOK.';
                wrap.append(note);
                
                return wrap;
            }

            function renderChecklist() {
                $("#chkTitle").textContent = "Checklist – " + (DEF_LABEL || DEF_ATUAL);
                const lista = $("#lista");
                lista.innerHTML = "";
                
                if (DEF_ATUAL === "Falta de Cura") {
                    lista.append(renderDiagGroup());
                }
                
                ITEMS.forEach((it, idx) => {
                    if (it.Tipo === "DIAGRAMA") return;
                    
                    const el = document.createElement('div');
                    el.className = 'item';
                    el.innerHTML = `<div class="title">${it.PassoOrdem}. ${it.OQueVerificar}</div>
                        ${it.ComoVerificar ? `<div class="how"><strong>Como verificar:</strong> ${it.ComoVerificar}</div>` : ""}
                        <div class="small" style="margin-top:6px">
                            <label><input type="radio" name="r${idx}" value="OK"> OK</label>
                            <label style="margin-left:10px"><input type="radio" name="r${idx}" value="NOK"> NOK</label>
                            <label style="margin-left:10px"><input type="radio" name="r${idx}" value="NA"> N.A.</label>
                        </div>
                        <textarea class="obs" placeholder="Observação (obrigatória se marcar NOK)"></textarea>
                        ${(it.RamoOK || it.RamoNOK || it.RamoNA) ? `<div class="branch-hint" data-idx="${idx}"></div>` : ""}`;
                    lista.append(el);
                });
                
                const total = ITEMS.filter(it => it.Tipo !== "DIAGRAMA").length;
                $("#total").textContent = total;
                $("#done").textContent = 0;
                $("#bar").style.width = '0%';
                
                $("#lista").addEventListener('change', (e) => {
                    if (e.target && e.target.matches('input[type=radio]')) {
                        const cont = e.target.closest('.item');
                        const area = cont?.querySelector('.obs');
                        if (area && e.target.value !== 'NOK') {
                            area.classList.remove('error');
                            cont.classList.remove('error');
                        }
                        updateBranchHint(e.target);
                        updateProgress();
                    }
                });
                
                Array.from(document.querySelectorAll('.obs')).forEach(t => {
                    t.addEventListener('input', () => {
                        t.classList.remove('error');
                        t.closest('.item').classList.remove('error');
                        t.style.height = 'auto';
                        t.style.height = t.scrollHeight + 'px';
                    });
                });
            }

            function updateBranchHint(input) {
                const card = input?.closest('.item');
                if (!card) return;
                const hint = card.querySelector('.branch-hint');
                if (!hint) return;
                const name = input.name || '';
                const idx = Number(name.replace(/^r/, ''));
                const it = ITEMS[idx];
                if (!it) return;
                const msg = input.value === 'OK' ? it.RamoOK : input.value === 'NOK' ? it.RamoNOK : it.RamoNA;
                if (msg) {
                    hint.innerHTML = `<strong>Próximo caminho recomendado:</strong> ${msg}`;
                    hint.classList.add('show');
                } else {
                    hint.textContent = '';
                    hint.classList.remove('show');
                }
            }

            function updateProgress() {
                const total = ITEMS.filter(it => it.Tipo !== "DIAGRAMA").length;
                const checked = $$("#lista input[type=radio]:checked").length;
                $("#done").textContent = checked;
                $("#bar").style.width = (total ? Math.round(100 * checked / total) : 0) + '%';
            }

            function validarCamposIniciais() {
                const wo = $("#inpWO"), tec = $("#inpTec"), sel = $("#selDef");
                [wo, tec, sel].forEach(el => el.classList.remove('error'));
                
                let ok = true;
                if (!wo.value.trim()) { wo.classList.add('error'); if (ok) wo.focus(); ok = false; }
                if (!tec.value.trim()) { tec.classList.add('error'); if (ok) tec.focus(); ok = false; }
                if (!sel.value.trim()) { sel.classList.add('error'); if (ok) sel.focus(); ok = false; }
                
                if (!ok) { showToast('Preencha WO, Técnico e selecione o defeito.'); }
                return ok;
            }

            function validarNOK() {
                const cards = $$("#lista .item");
                let erros = [];
                
                cards.forEach((card) => {
                    const sel = card.querySelector('input[type=radio]:checked');
                    const obs = card.querySelector('.obs');
                    const v = sel ? sel.value : "";
                    const o = (obs?.value || "").trim();
                    if (v === "NOK" && o.length === 0) {
                        erros.push(card);
                        obs?.classList.add('error');
                        card.classList.add('error');
                    }
                });
                
                if (erros.length) {
                    const card = erros[0];
                    card.scrollIntoView({behavior: 'smooth', block: 'center'});
                    const area = card.querySelector('.obs');
                    area?.focus();
                    showToast('Preencha a Observação onde marcou NOK.');
                    return false;
                }
                return true;
            }

            function getDiagramValues() {
                if (DEF_ATUAL !== "Falta de Cura") return null;
                const take = (id) => (document.getElementById(id)?.value || "").trim();
                return {
                    "Molde Esquerdo": {Superior: take("diag1_top"), Direita: take("diag1_right"), Inferior: take("diag1_bottom"), Esquerda: take("diag1_left")},
                    "Molde Direito": {Superior: take("diag2_top"), Direita: take("diag2_right"), Inferior: take("diag2_bottom"), Esquerda: take("diag2_left")},
                    "Platen Esquerdo": {Superior: take("diag3_top"), Direita: take("diag3_right"), Inferior: take("diag3_bottom"), Esquerda: take("diag3_left")},
                    "Platen Direito": {Superior: take("diag4_top"), Direita: take("diag4_right"), Inferior: take("diag4_bottom"), Esquerda: take("diag4_left")}

            function getFaltaCuraHeader() {
                const take = (id) => (document.getElementById(id)?.value || "").trim();
                return {
                    RL: take("inpRL"),
                    Prensa: take("inpPrensa"),
                    Lado: take("inpLado"),
                    Turno: take("inpTurno"),
                    Grupo: take("inpGrupo"),
                    Pneu: take("inpPneu"),
                    DataSetup: take("inpDataSetup")
                };
            }

            function formatDataBR(iso) {
                if (!iso) return "";
                const p = iso.split('-');
                return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
            }

            function buildResumo() {
                if (!validarCamposIniciais()) return;
                if (!validarNOK()) return;

                const cards = $$("#lista .item");
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear();
                const hh = String(now.getHours()).padStart(2, '0');
                const mi = String(now.getMinutes()).padStart(2, '0');
                const header = `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
                const wo = ($("#inpWO").value || "").trim();
                const tec = ($("#inpTec").value || "").trim();
                
                let parts = [header, (wo ? `WO: ${wo}` : ""), (tec ? `Técnico: ${tec}` : "")].filter(Boolean);
                let txt = parts.join(" | ") + "\n\n";

                if (DEF_ATUAL === "Falta de Cura") {
                    const h = getFaltaCuraHeader();
                    const cabecalhoFC = [
                        h.RL ? `RL: ${h.RL}` : "",
                        h.Prensa ? `Prensa: ${h.Prensa}` : "",
                        h.Lado ? `Lado: ${h.Lado}` : "",
                        h.Turno ? `Turno: ${h.Turno}` : "",
                        h.Grupo ? `Grupo: ${h.Grupo}` : "",
                        h.Pneu ? `Pneu: ${h.Pneu}` : "",
                        h.DataSetup ? `Data do Setup: ${formatDataBR(h.DataSetup)}` : ""
                    ].filter(Boolean);
                    if (cabecalhoFC.length) {
                        txt += cabecalhoFC.join(" | ") + "\n\n";
                    }

                    const d = getDiagramValues();
                    const addBlock = (titulo, obj) => {
                        txt += `${titulo}:\n`;
                        txt += ` - Superior: ${obj.Superior}°F\n`;
                        txt += ` - Direita: ${obj.Direita}°F\n`;
                        txt += ` - Inferior: ${obj.Inferior}°F\n`;
                        txt += ` - Esquerda: ${obj.Esquerda}°F\n\n`;
                    };
                    addBlock("Molde Esquerdo", d["Molde Esquerdo"]);
                    addBlock("Molde Direito", d["Molde Direito"]);
                    addBlock("Platen Esquerdo", d["Platen Esquerdo"]);
                    addBlock("Platen Direito", d["Platen Direito"]);
                }

                const linhasAp = [];
                cards.forEach(card => {
                    const title = card.querySelector('.title')?.textContent || "";
                    const sel = card.querySelector('input[type=radio]:checked');
                    const v = sel ? sel.value : "";
                    const o = (card.querySelector('.obs')?.value || "").trim();
                    if (v === "NOK" || o.length > 0) {
                        const label = title.replace(/^\\d+\\.\\s*/, '');
                        const obsTxt = o ? ` | Obs.: ${o}` : "";
                        linhasAp.push(`- ${label}${obsTxt}`);
                    }
                });
                
                if (linhasAp.length) {
                    txt += "Outros apontamentos:\n" + linhasAp.join("\n");
                }

                const out = $("#out");
                out.value = txt;
                out.style.height = 'auto';
                out.style.height = out.scrollHeight + 'px';
                $("#cardOut").style.display = "block";
                window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
            }

            function slugify(s) {
                const map = {'Á':'A','À':'A','Â':'A','Ã':'A','Ä':'A','á':'a','à':'a','â':'a','ã':'a','ä':'a','É':'E','È':'E','Ê':'E','Ë':'E','é':'e','è':'e','ê':'e','ë':'e','Í':'I','Ì':'I','Î':'I','Ï':'I','í':'i','ì':'i','î':'i','ï':'i','Ó':'O','Ò':'O','Ô':'O','Õ':'O','Ö':'O','ó':'o','ò':'o','ô':'o','õ':'o','ö':'o','Ú':'U','Ù':'U','Û':'U','Ü':'U','ú':'u','ù':'u','û':'u','ü':'u','Ç':'C','ç':'c','Ñ':'N','ñ':'n'};
                return s.split('').map(ch => map[ch] || ch).join('').replace(/[^A-Za-z0-9\-]+/g, ' ').trim().replace(/\\s+/g, '_');
            }

            // FOTOS - otimizadas antes de serem armazenadas/levadas ao PDF
            // 1600 px no maior lado e JPEG 76% mantem boa leitura no relatorio,
            // mas reduz drasticamente o tamanho do PDF em comparacao com a foto original.
            const PHOTO_MAX_DIMENSION = 1600;
            const PHOTO_JPEG_QUALITY = 0.76;

            function comprimirImagem(dataURL) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const maiorLado = Math.max(img.naturalWidth, img.naturalHeight);
                            const escala = maiorLado > PHOTO_MAX_DIMENSION
                                ? PHOTO_MAX_DIMENSION / maiorLado
                                : 1;
                            const w = Math.max(1, Math.round(img.naturalWidth * escala));
                            const h = Math.max(1, Math.round(img.naturalHeight * escala));

                            const c = document.createElement('canvas');
                            c.width = w;
                            c.height = h;
                            const ctx = c.getContext('2d', { alpha: false });
                            if (!ctx) throw new Error('Canvas indisponivel');

                            // Fundo branco evita fundo preto ao converter PNG/transparencia para JPEG.
                            ctx.fillStyle = '#fff';
                            ctx.fillRect(0, 0, w, h);
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            ctx.drawImage(img, 0, 0, w, h);

                            resolve({ dataURL: c.toDataURL('image/jpeg', PHOTO_JPEG_QUALITY), width: w, height: h });
                        } catch (err) {
                            reject(err);
                        }
                    };
                    img.onerror = () => reject(new Error('Nao foi possivel ler a imagem'));
                    img.src = dataURL;
                });
            }

            async function addPhotoDataURL(dataURL) {
                try {
                    const otimizada = await comprimirImagem(dataURL);
                    PHOTOS.push({
                        dataURL: otimizada.dataURL,
                        width: otimizada.width,
                        height: otimizada.height,
                        orientation: otimizada.width > otimizada.height ? 'landscape' : 'portrait',
                        caption: ""
                    });
                    renderPhotoList();
                    showToast('Imagem otimizada e anexada.');
                } catch (e) {
                    console.error(e);
                    showToast('Nao foi possivel processar esta imagem.');
                }
            }

            function addPhoto(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async e => {
                    await addPhotoDataURL(e.target.result);
                    document.getElementById('filePhoto').value = '';
                };
                reader.onerror = () => showToast('Nao foi possivel ler esta imagem.');
                reader.readAsDataURL(file);
            }
            function dataURLParaBlob(dataURL) {
                const partes = dataURL.split(',');
                const mime = (partes[0].match(/data:([^;]+)/) || [,'image/jpeg'])[1];
                const bin = atob(partes[1] || '');
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                return new Blob([bytes], { type: mime });
            }

            function nomeFoto(i, ph) {
                const wo = slugify((document.getElementById('inpWO')?.value || 'sem-WO').trim()) || 'sem-WO';
                const n = String(i + 1).padStart(2, '0');
                const legenda = slugify((ph?.caption || '').trim()).slice(0, 55);
                return `WO-${wo}_foto-${n}${legenda ? '_' + legenda : ''}.jpg`;
            }

            function baixarBlob(blob, nome) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = nome;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
            }

            function baixarFoto(i) {
                const ph = PHOTOS[i];
                if (!ph) return;
                baixarBlob(dataURLParaBlob(ph.dataURL), nomeFoto(i, ph));
                showToast('Foto salva.');
            }

            // Cria um ZIP simples (sem recomprimir os JPEGs) para baixar todas as fotos em um único arquivo.
            const CRC_TABLE = (() => {
                const table = new Uint32Array(256);
                for (let n = 0; n < 256; n++) {
                    let c = n;
                    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                    table[n] = c >>> 0;
                }
                return table;
            })();

            function crc32(bytes) {
                let c = 0xFFFFFFFF;
                for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
                return (c ^ 0xFFFFFFFF) >>> 0;
            }

            function u16(n) { return new Uint8Array([n & 255, (n >>> 8) & 255]); }
            function u32(n) { return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]); }
            function concatBytes(parts) {
                const total = parts.reduce((s, p) => s + p.length, 0);
                const out = new Uint8Array(total);
                let off = 0;
                parts.forEach(p => { out.set(p, off); off += p.length; });
                return out;
            }
            function blobParaBytes(blob) { return blob.arrayBuffer().then(b => new Uint8Array(b)); }

            async function criarZipFotos() {
                const enc = new TextEncoder();
                const locais = [], centrais = [];
                let offset = 0;
                const agora = new Date();
                const dosTime = ((agora.getHours() & 31) << 11) | ((agora.getMinutes() & 63) << 5) | ((Math.floor(agora.getSeconds()/2)) & 31);
                const dosDate = (((agora.getFullYear() - 1980) & 127) << 9) | (((agora.getMonth()+1) & 15) << 5) | (agora.getDate() & 31);

                for (let i = 0; i < PHOTOS.length; i++) {
                    const ph = PHOTOS[i];
                    const nomeBytes = enc.encode(nomeFoto(i, ph));
                    const dados = await blobParaBytes(dataURLParaBlob(ph.dataURL));
                    const crc = crc32(dados);
                    const tamanho = dados.length;

                    const local = concatBytes([
                        u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
                        u32(crc), u32(tamanho), u32(tamanho), u16(nomeBytes.length), u16(0), nomeBytes, dados
                    ]);
                    locais.push(local);

                    const central = concatBytes([
                        u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
                        u32(crc), u32(tamanho), u32(tamanho), u16(nomeBytes.length), u16(0), u16(0), u16(0), u16(0),
                        u32(0), u32(offset), nomeBytes
                    ]);
                    centrais.push(central);
                    offset += local.length;
                }

                const blocoLocal = concatBytes(locais);
                const blocoCentral = concatBytes(centrais);
                const fim = concatBytes([
                    u32(0x06054b50), u16(0), u16(0), u16(PHOTOS.length), u16(PHOTOS.length),
                    u32(blocoCentral.length), u32(blocoLocal.length), u16(0)
                ]);
                return new Blob([blocoLocal, blocoCentral, fim], { type: 'application/zip' });
            }

            async function baixarTodasFotos() {
                if (!PHOTOS.length) { showToast('Nenhuma foto anexada.'); return; }
                const btn = document.getElementById('btnDownloadAll');
                btn.disabled = true;
                const texto = btn.textContent;
                btn.textContent = 'Preparando fotos...';
                try {
                    const zip = await criarZipFotos();
                    const wo = slugify((document.getElementById('inpWO')?.value || 'sem-WO').trim()) || 'sem-WO';
                    baixarBlob(zip, `WO-${wo}_fotos.zip`);
                    showToast(`${PHOTOS.length} foto(s) salvas em ZIP.`);
                } catch (e) {
                    console.error(e);
                    showToast('Nao foi possivel gerar o arquivo de fotos.');
                } finally {
                    btn.textContent = texto;
                    btn.disabled = PHOTOS.length === 0;
                }
            }

            function renderPhotoList() {
                const box = document.getElementById('photoList');
                box.innerHTML = "";
                const btnAll = document.getElementById('btnDownloadAll');
                if (btnAll) btnAll.disabled = PHOTOS.length === 0;

                PHOTOS.forEach((ph, i) => {
                    const row = document.createElement('div');
                    row.className = 'photo-row';
                    const img = document.createElement('img');
                    img.src = ph.dataURL;
                    img.className = ph.orientation || ((ph.width || 0) > (ph.height || 0) ? 'landscape' : 'portrait');
                    row.append(img);
                    
                    const right = document.createElement('div');
                    right.innerHTML = `<textarea class="input caption" placeholder="Descreva o que esta foto mostra...">${ph.caption || ""}</textarea>
                                       <div class="actions" style="margin-top:6px">
                                         <button class="btn gray" data-save="${i}">Salvar foto</button>
                                         <button class="btn gray" data-del="${i}">Remover</button>
                                       </div>`;
                    row.append(right);
                    box.append(row);
                    
                    right.querySelector('.caption').addEventListener('input', (e) => {
                        PHOTOS[i].caption = e.target.value;
                    });

                    right.querySelector('[data-save]').addEventListener('click', () => baixarFoto(i));
                    
                    right.querySelector('[data-del]').addEventListener('click', () => {
                        PHOTOS.splice(i, 1);
                        renderPhotoList();
                    });
                });
            }
            document.getElementById('btnDownloadAll').addEventListener('click', baixarTodasFotos);
            document.getElementById('filePhoto').addEventListener('change', async (e) => {
                await addPhoto(e.target.files?.[0]);
                e.target.value = '';
            });
            document.getElementById('cameraPhoto').addEventListener('change', async (e) => {
                await addPhoto(e.target.files?.[0]);
                e.target.value = '';
            });

            // CÂMERA
            const camModal = document.getElementById('camModal');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const btnCam = document.getElementById('btnCam');
            const cameraPhoto = document.getElementById('cameraPhoto');
            const btnShot = document.getElementById('btnShot');
            const btnUse = document.getElementById('btnUse');
            const btnClose = document.getElementById('btnClose');

            async function openCamera() {
                // Arquivos HTML abertos diretamente (file://) normalmente nao podem usar getUserMedia.
                // No celular, usamos o seletor nativo com capture=environment, que abre a camera
                // e ainda envia a foto pelo mesmo fluxo de compressao do relatorio.
                const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
                const precisaCameraNativa = location.protocol === 'file:' || !window.isSecureContext || isMobile;

                if (precisaCameraNativa) {
                    cameraPhoto.value = '';
                    cameraPhoto.click();
                    return;
                }

                try {
                    const constraints = { video: { facingMode: { ideal: "environment" } }, audio: false };
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        cameraPhoto.value = '';
                        cameraPhoto.click();
                        return;
                    }
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    await video.play();
                    canvas.style.display = "none";
                    video.style.display = "block";
                    btnUse.style.display = "none";
                    btnShot.style.display = "inline-flex";
                    camModal.style.display = "flex";
                } catch(e) {
                    showToast("A camera do navegador foi bloqueada. Use a camera nativa do aparelho.");
                }
            }
            btnCam.addEventListener('click', openCamera);
            btnClose.addEventListener('click', () => {
                if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
                camModal.style.display = "none";
            });
            btnShot.addEventListener('click', () => {
                const w = video.videoWidth, h = video.videoHeight;
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, w, h);
                canvas.style.display = "block";
                video.style.display = "none";
                btnUse.style.display = "inline-flex";
                btnShot.style.display = "none";
            });
            btnUse.addEventListener('click', async () => {
                btnUse.disabled = true;
                try {
                    // A imagem da camera tambem passa pela mesma reducao antes de entrar no relatorio.
                    const dataURL = canvas.toDataURL('image/jpeg', 0.82);
                    await addPhotoDataURL(dataURL);
                    btnClose.click();
                } finally {
                    btnUse.disabled = false;
                }
            });

            // PDF
            function montarPDF() {
                if (!validarCamposIniciais()) return;
                if (!validarNOK()) return;
                
                const cards = Array.from(document.querySelectorAll('#lista .item'));
                const phTable = document.getElementById('phTable');
                phTable.innerHTML = "";
                
                cards.forEach(card => {
                    const title = card.querySelector('.title')?.textContent || "";
                    const sel = card.querySelector('input[type=radio]:checked');
                    const v = sel ? sel.value : "";
                    const o = (card.querySelector('.obs')?.value || "").trim();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${title.replace(/^\\d+\\.\\s*/, '')}</td><td>${v || "-"}</td><td>${o}</td>`;
                    phTable.append(tr);
                });
                
                const now = new Date();
                const dd = String(now.getDate()).padStart(2, '0');
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const yyyy = now.getFullYear();
                const hh = String(now.getHours()).padStart(2, '0');
                const mi = String(now.getMinutes()).padStart(2, '0');
                
                document.getElementById('phHeader').textContent = `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
                const woTxt = (document.getElementById('inpWO').value || "-");
                const tecTxt = (document.getElementById('inpTec').value || "-");
                document.getElementById('phWO').textContent = "WO: " + woTxt;
                document.getElementById('phTec').textContent = "Técnico: " + tecTxt;
                document.getElementById('phDefeito').textContent = "Defeito: " + (DEF_LABEL || DEF_ATUAL);

                const phExtraHeader = document.getElementById('phExtraHeader');
                phExtraHeader.textContent = "";
                phExtraHeader.style.display = 'none';
                if (DEF_ATUAL === "Falta de Cura") {
                    const h = getFaltaCuraHeader();
                    const campos = [
                        ['RL', h.RL],
                        ['Prensa', h.Prensa],
                        ['Lado', h.Lado],
                        ['Turno', h.Turno],
                        ['Grupo', h.Grupo],
                        ['Pneu', h.Pneu],
                        ['Data do Setup', formatDataBR(h.DataSetup)]
                    ].filter(([, v]) => v);
                    if (campos.length) {
                        phExtraHeader.style.display = 'block';
                        phExtraHeader.textContent = campos.map(([k, v]) => `${k}: ${v}`).join(' | ');
                    }
                }
                
                const phDiagramas = document.getElementById('phDiagramas');
                phDiagramas.innerHTML = "";
                
                if (DEF_ATUAL === "Falta de Cura") {
                    const d = {
                        "Molde Esquerdo": {
                            Superior: document.getElementById('diag1_top')?.value,
                            Direita: document.getElementById('diag1_right')?.value,
                            Inferior: document.getElementById('diag1_bottom')?.value,
                            Esquerda: document.getElementById('diag1_left')?.value
                        },
                        "Molde Direito": {
                            Superior: document.getElementById('diag2_top')?.value,
                            Direita: document.getElementById('diag2_right')?.value,
                            Inferior: document.getElementById('diag2_bottom')?.value,
                            Esquerda: document.getElementById('diag2_left')?.value
                        },
                        "Platen Esquerdo": {
                            Superior: document.getElementById('diag3_top')?.value,
                            Direita: document.getElementById('diag3_right')?.value,
                            Inferior: document.getElementById('diag3_bottom')?.value,
                            Esquerda: document.getElementById('diag3_left')?.value
                        },
                        "Platen Direito": {
                            Superior: document.getElementById('diag4_top')?.value,
                            Direita: document.getElementById('diag4_right')?.value,
                            Inferior: document.getElementById('diag4_bottom')?.value,
                            Esquerda: document.getElementById('diag4_left')?.value
                        }
                    };
                    
                    const grid = document.createElement('div');
                    grid.className = 'diagram-grid avoid-break';
                    
                    const buildPrintCircle = (titulo, vals) => {
                        const box = document.createElement('div');
                        box.className = 'diag-block print-diagram';
                        const h = document.createElement('div');
                        h.className = 'diag-title';
                        h.textContent = titulo;
                        box.append(h);
                        
                        const c = document.createElement('div');
                        c.className = 'circle';
                        c.style.position = 'relative';
                        c.innerHTML = '<div class="axis"></div><div class="axis h"></div>';
                        
                        const mk = (cls, txt) => {
                            const s = document.createElement('span');
                            s.className = 'qval ' + cls;
                            s.textContent = txt;
                            return s;
                        };
                        
                        c.append(mk('top', (vals.Superior || '') + '°F'));
                        c.append(mk('right', (vals.Direita || '') + '°F'));
                        c.append(mk('bottom', (vals.Inferior || '') + '°F'));
                        c.append(mk('left', (vals.Esquerda || '') + '°F'));
                        box.append(c);
                        return box;
                    };
                    
                    grid.append(buildPrintCircle('Molde Esquerdo', d["Molde Esquerdo"]));
                    grid.append(buildPrintCircle('Molde Direito', d["Molde Direito"]));
                    grid.append(buildPrintCircle('Platen Esquerdo', d["Platen Esquerdo"]));
                    grid.append(buildPrintCircle('Platen Direito', d["Platen Direito"]));
                    phDiagramas.append(grid);
                }
                
                const wrapFotos = document.getElementById('phFotosWrap');
                const gridFotos = document.getElementById('phFotos');
                gridFotos.innerHTML = "";
                
                if (PHOTOS.length) {
                    wrapFotos.style.display = 'block';
                    PHOTOS.forEach(p => {
                        const fig = document.createElement('figure');
                        const im = document.createElement('img');
                        im.src = p.dataURL;
                        im.className = p.orientation || ((p.width || 0) > (p.height || 0) ? 'landscape' : 'portrait');
                        fig.append(im);
                        const cap = document.createElement('figcaption');
                        cap.textContent = p.caption || '';
                        fig.append(cap);
                        gridFotos.append(fig);
                    });
                } else { wrapFotos.style.display = 'none'; }
                
                document.getElementById('phResumo').textContent = document.getElementById('out').value.trim();
                
                const defeito = (DEF_ATUAL || 'Defeito').replace(/\\s+/g, '-');
                const safeTec = slugify(tecTxt);
                const dataStr = `${dd}-${mm}-${yyyy}_${hh}h${mi}`;
                const fname = `WO-${slugify(woTxt)}_${safeTec}_${defeito}_${dataStr}.pdf`;
                const prevTitle = document.title;
                document.title = fname.replace(/\\.pdf$/, '');
                
                // Garantir que o grid não quebre no meio em navegadores móveis
                document.querySelectorAll('.diagram-grid').forEach(el => {
                    el.style.pageBreakInside = 'avoid';
                    el.style.breakInside = 'avoid';
                });
                
                const showSavedToast = () => {
                    showToast(`Salvo: ${fname}`);
                    window.removeEventListener('afterprint', showSavedToast);
                    document.title = prevTitle;
                };
                
                window.addEventListener('afterprint', showSavedToast);
                setTimeout(() => { window.print(); }, 40);
            }

            // EVENTOS PRINCIPAIS
            const selDefeito = document.getElementById('selDef');
            const fcHeaderFields = document.getElementById('fcHeaderFields');
            const atualizarCamposFaltaCura = () => {
                fcHeaderFields.style.display = selDefeito.value === "Falta de Cura" ? "block" : "none";
            };
            selDefeito.addEventListener('change', atualizarCamposFaltaCura);
            atualizarCamposFaltaCura();

            document.getElementById('btnGo').addEventListener('click', () => {
                if (!validarCamposIniciais()) return;
                const sel = document.getElementById('selDef');
                DEF_ATUAL = sel.value;
                DEF_LABEL = sel.options[sel.selectedIndex]?.textContent?.trim() || DEF_ATUAL;
                ITEMS = (DATA.itens_por_defeito[DEF_ATUAL] || []);
                if (!ITEMS.length) {
                    document.getElementById('cardChk').style.display = 'none';
                    showToast('Checklist não encontrado para o defeito selecionado.');
                    return;
                }
                renderChecklist();
                document.getElementById('cardChk').style.display = 'block';
                document.getElementById('cardOut').style.display = 'none';
                document.getElementById('cardChk').scrollIntoView({behavior: 'smooth', block: 'start'});
            });

            document.getElementById('btnResumo').addEventListener('click', () => { buildResumo(); });
            document.getElementById('btnPDF').addEventListener('click', montarPDF);
            
            document.getElementById('btnCopy').addEventListener('click', () => {
                const txt = document.getElementById('out').value;
                const done = () => { showToast('Copiado!'); };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(done).catch(() => {});
                } else {
                    const out = document.getElementById('out');
                    out.select();
                    document.execCommand('copy');
                    done();
                }
            });
            
            document.getElementById('btnReset')?.addEventListener('click', () => location.reload());
            
            document.getElementById('btnClear')?.addEventListener('click', () => {
                document.getElementById('inpWO').value = "";
                document.getElementById('inpTec').value = "";
                document.getElementById('selDef').value = "";
                DEF_ATUAL = ""; DEF_LABEL = ""; ITEMS = [];
                ['inpRL','inpPrensa','inpLado','inpTurno','inpGrupo','inpPneu','inpDataSetup'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.value = "";
                });
                document.getElementById('fcHeaderFields').style.display = 'none';
                document.getElementById('lista').innerHTML = "";
                document.getElementById('cardChk').style.display = 'none';
                document.getElementById('done').textContent = "0";
                document.getElementById('total').textContent = "0";
                document.getElementById('bar').style.width = "0%";
                document.getElementById('out').value = "";
                document.getElementById('cardOut').style.display = 'none';
                PHOTOS = [];
                document.getElementById('photoList').innerHTML = "";
                window.scrollTo({top: 0, behavior: 'smooth'});
            });
            
            ['inpWO', 'inpTec', 'selDef'].forEach(id => {
                document.getElementById(id).addEventListener('input', e => { e.target.classList.remove('error'); });
            });
        });
    </script>
</body>
